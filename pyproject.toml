[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conjurepr"
version = "0.1.0"
description = "API-first bounded pull-request automation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
conjurepr = "conjurepr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
